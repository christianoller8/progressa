# Gatekeeper for GitHub Flow: every pull request must pass these checks before merging to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# On a pull request, a new push cancels the run still in progress. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ci
